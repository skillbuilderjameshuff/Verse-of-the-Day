    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Cormorant Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    overflow-x: hidden;
  }

  header {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 28px;
  }

  header img {
    width: min(180px, 40vw);
    height: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 12px;
  }

  #verse-wrap {
    text-align: center;
  }

  #verse-text {
    font-family: 'Great Vibes', cursive;
    font-weight: 700;
    color: var(--gold);
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, #9c7a1f);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    font-size: clamp(28px, 6vw, 54px);
    line-height: 1.35;
    margin: 0 0 18px 0;
    text-wrap: balance;
  }

  #verse-ref {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--gold);
    font-size: clamp(15px, 2.4vw, 20px);
    opacity: 0.9;
  }

  footer {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: 18px;
  }

  footer p {
    font-family: 'Great Vibes', cursive;
    font-weight: 700;
    text-decoration: underline;
    color: var(--gold);
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, #9c7a1f);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    font-size: clamp(36px, 5.4vw, 45px);
    letter-spacing: 0.03em;
    margin: 0;
    text-align: center;
    opacity: 0.9;
  }

  @media (max-width: 480px) {
    header { padding-top: 16px; }
    main { padding: 24px 8px; }
  }
</style>
</head>

  function dayOfYear(date) {
    const start = new Date(date.getFullYear(), 0, 0);
    const diff = date - start;
    const oneDay = 1000 * 60 * 60 * 24;
    return Math.floor(diff / oneDay);
  }

  const today = new Date();
  const idx = dayOfYear(today) % verses.length;
  const verse = verses[idx];

  document.getElementById('verse-text').textContent = verse.text;
  document.getElementById('verse-ref').textContent = verse.ref;
</script>
